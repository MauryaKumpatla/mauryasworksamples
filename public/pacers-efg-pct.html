  html, body {
    height: auto;
    margin: 0;
    padding: 0;
  }
  /* Center the whole chart composition in the middle of the available height. */
  body {
    display: block;
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  .vb-root {
    /* ---- knobs ported from the .py ---- */
    --ink: #000;
    --dot-fill: #ffffff;
    --dot-edge: #000000;
    --teal: rgb(0, 222, 211);     /* HEADSHOT_BG_COLORS for Edey / Reed */
    --ref-line: #000;
    --box-border: #000;
    --box-bg: #ffffff;

    font-family: "LatoEmbed", -apple-system, system-ui, sans-serif;
    color: var(--ink);
    background: #fff;
    width: 100%;
    max-width: 760px;            /* desktop cap; shrinks freely below this */
    margin: 0 auto;
    box-sizing: border-box;
    -webkit-text-size-adjust: 100%;
  }
  .vb-root * { box-sizing: border-box; }

  .vb-title {
    font-weight: 700;
    text-align: center;
    line-height: 1.1;
    margin: 0;
  }
  .vb-subtitle {
    font-weight: 400;
    text-align: center;
    line-height: 1.15;
    margin: 0 auto;
    color: #000;
  }

  .vb-chart { width: 100%; height: 100%; display: block; touch-action: manipulation; }

  /* axis text */
  .vb-tick { font-weight: 400; fill: #000; }
  .vb-axislabel { font-weight: 700; fill: #000; }

  .vb-spine { stroke: #000; fill: none; }
  .vb-refline { stroke: var(--ref-line); fill: none; }

  .vb-dot { fill: var(--dot-fill); stroke: var(--dot-edge); }
  .vb-dot.is-labeled { /* labeled players use a thin highlight ring via JS */ }

  .vb-namelabel {
    font-weight: 700;
    fill: #000;
    paint-order: stroke;          /* mimic the white text outline from the .py */
    stroke: #fff;
    stroke-linejoin: round;
  }

  /* hover / tap name box */
  .vb-tipbox-rect {
    fill: var(--box-bg);
    stroke: var(--box-border);
    stroke-width: 1;
  }
  .vb-tipbox-text { font-weight: 700; fill: #000; }


  .vb-caption {
    font-family: "LatoEmbed", -apple-system, system-ui, sans-serif;
    font-weight: 400;
    font-size: 15px;
    line-height: 1.45;
    color: #767676;
    text-align: center;
    max-width: 640px;
    margin: 18px auto 0 auto;
    padding: 0 8px 4px 8px;
  }
</style>

  const root = document.getElementById("vb-root");
  const svg = d3.select("#vb-chart");
  let activeIdx = null;

  function render() {
    const W = root.clientWidth;
    if (!W) return;
    const s = W / 760;
    const fTitle = Math.max(20, 30 * s);
    const fSub = Math.max(11, 13 * s);
    const fTick = Math.max(9, 12 * s);
    const fAxis = Math.max(11, 14 * s);
    const fLeg = Math.max(10, 13 * s);
    const fBox = Math.max(10, 13 * s);
    const fTip = Math.max(11, 13 * s);
    const dotR = Math.max(4.5, 7 * s);

    svg.selectAll("*").remove();
    const SHIFT = Math.max(4, 6 * s);
    svg.attr("width", "100%");

    const mLeft = Math.max(56, 70 * s);
    const mRight = Math.max(24, 30 * s);
    let pw = W - mLeft - mRight;
    const plotCenterX = W / 2;

    const textCenterX = W / 2 - SHIFT + 12 * s;
    let cursorY = fTitle + 6;
    svg.append("text").attr("class", "vb-title")
      .attr("x", textCenterX).attr("y", cursorY)
      .attr("text-anchor", "middle")
      .style("font-size", fTitle + "px").style("font-weight", 700)
      .text(TITLE);
    cursorY += fSub + 10;
    const subSource = Array.isArray(SUBTITLE) ? SUBTITLE : [SUBTITLE];
    const subMaxW = W - 2 * Math.max(14, 18 * s);
    const subProbe = svg.append("text").attr("text-anchor", "middle")
      .style("font-size", fSub + "px").style("font-weight", 400).style("visibility", "hidden");
    const measureSub = (txt) => { subProbe.text(txt); return subProbe.node().getComputedTextLength(); };
    let subLines;
    if (subSource.every(line => measureSub(line) <= subMaxW)) {
      subLines = subSource;
    } else {
      subLines = [];
      let curLine = [];
      subSource.join(" ").split(/\s+/).forEach(word => {
        curLine.push(word);
        if (measureSub(curLine.join(" ")) > subMaxW && curLine.length > 1) {
          curLine.pop(); subLines.push(curLine.join(" ")); curLine = [word];
        }
      });
      if (curLine.length) subLines.push(curLine.join(" "));
    }
    subProbe.remove();
    subLines.forEach((line, i) => {
      svg.append("text").attr("x", textCenterX).attr("y", cursorY)
        .attr("text-anchor", "middle").style("font-size", fSub + "px").style("font-weight", 400)
        .text(line);
      if (i < subLines.length - 1) cursorY += fSub + 1;
    });

    const m = {
      top: cursorY + 18,

    };
    let H, ph;
    H = W;
    ph = H - m.top - m.bottom;
    svg.attr("viewBox", `${-SHIFT} 0 ${W} ${H}`);

    const x = d3.scaleLinear().domain(X_DOMAIN).range([m.left, m.left + pw]);
    const y = d3.scaleLinear().domain(Y_DOMAIN).range([m.top + ph, m.top]);
    const plot = svg.append("g");

    plot.append("line").attr("class", "vb-refline")
      .attr("x1", x(REF_X)).attr("x2", x(REF_X))
      .attr("y1", y(Y_DOMAIN[0])).attr("y2", y(Y_DOMAIN[1]))
      .attr("stroke-width", Math.max(1.2, 1.5 * s)).attr("stroke-dasharray", "5 4");
    plot.append("line").attr("class", "vb-refline")
      .attr("x1", x(X_DOMAIN[0])).attr("x2", x(X_DOMAIN[1]))
      .attr("y1", y(REF_Y)).attr("y2", y(REF_Y))
      .attr("stroke-width", Math.max(1.2, 1.5 * s)).attr("stroke-dasharray", "5 4");

      .attr("stroke-width", 1);

    X_TICKS.forEach(t => {
      svg.append("text").attr("class", "vb-tick")
        .attr("x", x(t)).attr("y", m.top + ph + fTick + 6)
        .attr("text-anchor", "middle").style("font-size", fTick + "px").text(t);
    });
    Y_TICKS.forEach(t => {
      svg.append("text").attr("class", "vb-tick")
        .attr("x", m.left - 8).attr("y", y(t) + fTick * 0.35)
        .attr("text-anchor", "end").style("font-size", fTick + "px").text(t);
    });

    const gapPx = Math.max(22, 30 * s);
    const yTickX = m.left - 8;

    const xTickBaselineY = m.top + ph + fTick + 6;

      .attr("x", m.left + pw / 2).attr("y", xTickBaselineY + gapPx + 3)
      .attr("text-anchor", "middle").style("font-size", fAxis + "px").style("font-weight", 700)
      .text(X_LABEL);
    svg.append("text").attr("class", "vb-axislabel")
      .attr("transform", `translate(${yLabelX},${m.top + ph / 2}) rotate(-90)`)
      .attr("text-anchor", "middle").style("font-size", fAxis + "px").style("font-weight", 700)
      .text(Y_LABEL);

    const boxPad = Math.max(6, 8 * s);

    const legW = legR * 2 + 8 + legLabelW + legPadX * 2;
    const legH = legRowH * legItems.length + legPadY * 2 - (legRowH - fLeg);

      const cy = legY + legPadY + i * legRowH + legRowH / 2 - (legRowH - fLeg) / 2;
      svg.append("circle").attr("cx", legX + legPadX + legR).attr("cy", cy).attr("r", legR)
        .attr("fill", it.color).attr("stroke", "#000").attr("stroke-width", 1);
      svg.append("text").attr("x", legX + legPadX + legR * 2 + 8).attr("y", cy)
        .attr("dominant-baseline", "central").style("font-size", fLeg + "px").style("font-weight", 600)
        .text(it.label);
    });

    const dots = plot.append("g").selectAll("circle")
      .data(DATA).enter().append("circle")
      .attr("class", "vb-dot")
      .attr("cx", d => x(d.x)).attr("cy", d => y(d.y)).attr("r", dotR)
      .style("fill", d => d.win ? "#002D62" : "#FDBB30")
      .attr("stroke", "#000").attr("stroke-width", Math.max(0.7, 0.9 * s))
      .style("cursor", "pointer");

    const tip = svg.append("g").style("display", "none");
    const tipRect = tip.append("rect").attr("class", "vb-tipbox-rect");
    const tipText = tip.append("text").attr("class", "vb-tipbox-text")
      .attr("dominant-baseline", "middle").style("font-size", fTip + "px");

    function showTip(d) {
      tipText.text(d.date);
      tip.style("display", null);
      const padX = 10, padY = 7;
      const bb = tipText.node().getBBox();
      const boxW = bb.width + padX * 2;
      const boxH = bb.height + padY * 2;
      let bx = x(d.x) + dotR + 8;
      if (bx + boxW > W - 4) bx = x(d.x) - dotR - 8 - boxW;
      let by = y(d.y) - boxH / 2;
      by = Math.max(m.top + 2, Math.min(by, m.top + ph - boxH - 2));
      tipRect.attr("x", bx).attr("y", by).attr("width", boxW).attr("height", boxH);
      tipText.attr("x", bx + padX).attr("y", by + boxH / 2);
    }
    function hideTip() { tip.style("display", "none"); activeIdx = null; }

    dots.on("mouseenter", (e, d) => showTip(d))
        .on("mouseleave", hideTip)
        .on("click", (e, d) => {
          e.stopPropagation();
          const i = DATA.indexOf(d);
          if (activeIdx === i) { hideTip(); } else { activeIdx = i; showTip(d); }
        });
    svg.on("click", hideTip);

    const cbb = svg.node().getBBox();
    const cMargin = Math.max(0, (H - cbb.height) / 2);
    const cShiftY = cMargin - cbb.y;
    svg.attr("viewBox", `${-SHIFT} ${(-cShiftY).toFixed(2)} ${W} ${H}`);
  }

  const ro = new ResizeObserver(() => render());
  ro.observe(root);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(render);
  window.addEventListener("orientationchange", () => setTimeout(render, 120));
  render();
